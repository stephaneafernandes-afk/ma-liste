<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ma liste">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2f7de1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Ma liste</title>
<style>
:root{--bg:#f2f2f7;--card:#ffffff;--text:#000000;--muted:#5c5c63;--accent:#0a63d6;--accent-text:#ffffff;--danger:#c4161c;--line:#d1d1d6}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#000000;--card:#1c1c1e;--text:#ffffff;--muted:#b0b0b8;--accent:#4f9cf7;--accent-text:#000000;--danger:#ff6b6b;--line:#3a3a3c}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.35;background:var(--bg);color:var(--text);min-height:100vh;-webkit-text-size-adjust:100%}

/* En-tête */
header{position:sticky;top:0;z-index:1;background:var(--card);border-bottom:1px solid var(--line);padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top))}
h1{font-size:26px;margin:0;font-weight:700}

/* Contenu */
main{padding:20px;padding-bottom:calc(32px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.section[hidden]{display:none}

/* Formulaire d'ajout */
form.row{display:flex;gap:10px;margin-bottom:20px}
input[type=text],input[type=date]{flex:1;min-width:0;height:56px;font-size:18px;padding:0 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--text)}
input[type=text]:focus,input[type=date]:focus{outline:none;border-color:var(--accent)}
.add{height:56px;min-width:96px;background:var(--accent);color:var(--accent-text);border:0;border-radius:14px;font-size:18px;font-weight:700;cursor:pointer}

/* Navigation par jour */
.day-nav{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.day-nav .label{flex:1;text-align:center;font-size:20px;font-weight:700;text-transform:capitalize}
.round{width:48px;height:48px;border:2px solid var(--line);border-radius:50%;background:var(--card);color:var(--accent);font-size:24px;line-height:1;cursor:pointer;flex:none}
.day-tools{display:flex;justify-content:center;gap:12px;margin-bottom:20px}
.pill{height:44px;padding:0 18px;border:2px solid var(--line);border-radius:22px;background:var(--card);color:var(--accent);font-size:16px;font-weight:600;cursor:pointer}
.day-tools input[type=date]{flex:0 0 auto;width:auto;height:44px;font-size:16px;border-radius:22px;padding:0 14px}

/* Listes */
ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
li{display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:19px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
li:last-child{border-bottom:0}
li:active{background:var(--line)}
li .text{flex:1;word-break:break-word}
li.done .text{text-decoration:line-through;color:var(--muted)}
.check{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--accent);flex:none;display:flex;align-items:center;justify-content:center;color:var(--accent-text);font-size:18px;font-weight:700}
li.done .check{background:var(--accent)}
li.done .check::before{content:"✓"}
.del{width:44px;height:44px;margin-right:-10px;background:none;border:0;color:var(--danger);font-size:26px;line-height:1;cursor:pointer;flex:none}
.empty{display:block;color:var(--muted);text-align:center;padding:28px 16px;font-size:17px;cursor:default}
.empty:active{background:none}
.hint{font-size:16px;color:var(--muted);text-align:center;margin:0 0 16px}

/* Onglets en haut, sous le titre */
.tabs{display:flex;gap:10px;margin-top:14px}
.tabs button{flex:1;height:52px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--muted);font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.tabs button .icon{font-size:20px;line-height:1}
.tabs button.active{color:var(--accent-text);background:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Ma liste</h1>
  <nav class="tabs">
    <button id="tab-tasks" class="active" type="button"><span class="icon">📝</span>À faire</button>
    <button id="tab-courses" type="button"><span class="icon">🛒</span>Courses</button>
  </nav>
</header>

<main>
  <section id="section-tasks" class="section">
    <div class="day-nav">
      <button class="round" id="prev-btn" type="button" aria-label="Jour précédent">‹</button>
      <span class="label" id="day-label"></span>
      <button class="round" id="next-btn" type="button" aria-label="Jour suivant">›</button>
    </div>
    <div class="day-tools">
      <button class="pill" id="tomorrow-btn" type="button">Demain</button>
      <input type="date" id="day-input" aria-label="Choisir un jour">
    </div>
    <form class="row" id="task-form">
      <input type="text" id="task-input" placeholder="Ajouter une tâche" autocomplete="off" required>
      <button class="add" type="submit">Ajouter</button>
    </form>
    <ul id="task-list"></ul>
  </section>

  <section id="section-courses" class="section" hidden>
    <form class="row" id="course-form">
      <input type="text" id="course-input" placeholder="Ajouter un article" autocomplete="off" required>
      <button class="add" type="submit">Ajouter</button>
    </form>
    <p class="hint">Touche un article quand il est acheté pour le retirer.</p>
    <ul id="course-list"></ul>
  </section>
</main>

<script>
const KEY = 'ma-liste-v1';

let data = {};
try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { data = {}; }
data.tasks = data.tasks || [];
data.courses = data.courses || [];

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* stockage indisponible */ }
}

function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  Object.assign(el, props);
  kids.forEach(k => el.append(k));
  return el;
}

// Date au format AAAA-MM-JJ en heure locale
function toIso(d) {
  const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return z.toISOString().slice(0, 10);
}
function addDays(iso, n) {
  const d = new Date(iso + 'T00:00');
  d.setDate(d.getDate() + n);
  return toIso(d);
}
function tomorrowIso() {
  return addDays(toIso(new Date()), 1);
}
function dayLabel(iso) {
  const label = new Date(iso + 'T00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  return iso === tomorrowIso() ? 'Demain, ' + label : label;
}

let currentDay = tomorrowIso();

// ---------- Onglets ----------
function showTab(name) {
  const isTasks = name === 'tasks';
  document.getElementById('tab-tasks').classList.toggle('active', isTasks);
  document.getElementById('tab-courses').classList.toggle('active', !isTasks);
  document.getElementById('section-tasks').hidden = !isTasks;
  document.getElementById('section-courses').hidden = isTasks;
}
document.getElementById('tab-tasks').onclick = () => showTab('tasks');
document.getElementById('tab-courses').onclick = () => showTab('courses');

// ---------- À faire ----------
const dayInput = document.getElementById('day-input');
const taskList = document.getElementById('task-list');

function renderTasks() {
  document.getElementById('day-label').textContent = dayLabel(currentDay);
  dayInput.value = currentDay;

  // Tâches à faire en premier, tâches faites en dessous
  const items = data.tasks
    .filter(t => t.date === currentDay)
    .sort((a, b) => Number(a.done) - Number(b.done));

  if (items.length === 0) {
    taskList.replaceChildren(h('li', { className: 'empty' }, 'Rien de prévu ce jour-là'));
    return;
  }
  taskList.replaceChildren(...items.map(t =>
    h('li', {
      className: t.done ? 'done' : '',
      onclick: () => { t.done = !t.done; save(); renderTasks(); }
    },
      h('div', { className: 'check' }),
      h('span', { className: 'text' }, t.text),
      h('button', {
        className: 'del', type: 'button', title: 'Supprimer', 'aria-label': 'Supprimer',
        onclick: e => {
          e.stopPropagation();
          data.tasks = data.tasks.filter(x => x !== t);
          save(); renderTasks();
        }
      }, '×')
    )
  ));
}

document.getElementById('task-form').onsubmit = e => {
  e.preventDefault();
  const input = document.getElementById('task-input');
  const text = input.value.trim();
  if (!text) return;
  data.tasks.push({ id: Date.now(), text, date: currentDay, done: false });
  input.value = '';
  save(); renderTasks();
};

document.getElementById('prev-btn').onclick = () => { currentDay = addDays(currentDay, -1); renderTasks(); };
document.getElementById('next-btn').onclick = () => { currentDay = addDays(currentDay, 1); renderTasks(); };
dayInput.onchange = () => {
  if (dayInput.value) { currentDay = dayInput.value; renderTasks(); }
};
document.getElementById('tomorrow-btn').onclick = () => {
  currentDay = tomorrowIso();
  renderTasks();
};

// ---------- Courses ----------
const courseList = document.getElementById('course-list');

function renderCourses() {
  if (data.courses.length === 0) {
    courseList.replaceChildren(h('li', { className: 'empty' }, 'Liste vide pour le moment'));
    return;
  }
  courseList.replaceChildren(...data.courses.map(c =>
    h('li', {
      title: 'Toucher pour retirer',
      onclick: () => {
        data.courses = data.courses.filter(x => x !== c);
        save(); renderCourses();
      }
    }, h('span', { className: 'text' }, c.text))
  ));
}

document.getElementById('course-form').onsubmit = e => {
  e.preventDefault();
  const input = document.getElementById('course-input');
  const text = input.value.trim();
  if (!text) return;
  data.courses.push({ id: Date.now(), text });
  input.value = '';
  save(); renderCourses();
};

// ---------- Démarrage ----------
renderTasks();
renderCourses();

// Hors ligne : enregistre le service worker si le site est servi en HTTPS
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
